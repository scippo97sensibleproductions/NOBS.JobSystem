name: Publish to NuGet

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MinVer
        run: dotnet tool install --global minver-cli --version 4.3.0

      - name: Determine Version
        id: minver
        run: |
          VERSION=$(minver --tag-prefix v --minimum-major-minor 1.0)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined Version: $VERSION"
        shell: bash

      - name: Build and Pack
        run: |
          dotnet build -c Release -p:Version=${{ steps.minver.outputs.version }}
          
          for proj in $(find . -name "*.csproj" -print0 | xargs -0 grep -l '<GeneratePackageOnBuild>true</GeneratePackageOnBuild>'); do
              dotnet pack $proj -c Release --no-build -p:Version=${{ steps.minver.outputs.version }} -o ../packages
          done
        shell: bash

      - name: List Generated Packages
        run: ls -R packages

      - name: Publish to NuGet
        run: dotnet nuget push "packages/**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate